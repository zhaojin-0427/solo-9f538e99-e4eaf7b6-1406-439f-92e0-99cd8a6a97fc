{% extends "base.html" %}
{% block content %}
<h2>复核（整点剔除 / 恢复）</h2>
<p>当前版本 <b>v{{ state.id }}</b>（{{ status_text[state.status] }}）。
   勾选表示<b>剔除</b>该试验点；取消勾选表示恢复。提交后生成新版本，
   可比性立即按新关系判断；保存失败则沿用原状态。</p>

<form method="post" action="{{ url_for('review_form') }}">
  <table>
    <tr><th>剔除</th><th>试验点</th><th>小区行数</th><th>品种数</th></tr>
    {% for s in sites %}
    <tr>
      <td><input type="checkbox" name="exclude" value="{{ s.site }}"
                 {% if s.site in excluded %}checked{% endif %}></td>
      <td>{{ s.site }}</td>
      <td>{{ s.n }}</td>
      <td>{{ s.nv }}</td>
    </tr>
    {% endfor %}
  </table>
  <button type="submit">提交复核</button>
</form>
{% endblock %}
